services:
  backend:
    build:
      context: ./backend
    container_name: beatflow-backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    container_name: beatflow-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  frontend:
    build:
      context: ./frontend
    container_name: beatflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
