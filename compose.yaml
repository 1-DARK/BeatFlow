services:
  backend:
    build:
      context: ./backend
    container_name: beatflow-backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    container_name: beatflow-mongodb
    volumes:
      - mongo-data:/data/db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    container_name: beatflow-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
